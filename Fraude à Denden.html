<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fraude à Denden</title>
    <style>
      body {
        margin: 0; padding: 2rem 1rem; background: #f6f7f4; color: #1d2a2a;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5;
      }
      main { max-width: 420px; margin: 0 auto; }
      h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: #5d6b6b; }
      table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dfe4e0; }
      th, td { padding: .8rem 1rem; text-align: center; }
      th { background: #1f6f6b; color: #fff; font-weight: 600; }
      td { font-size: 1.5rem; font-weight: 700; color: #b4521a; }
      @media (prefers-color-scheme: dark) {
        body { background: #121a1a; color: #e6eeec; }
        p { color: #9bb0ad; }
        table { background: #1a2424; border-color: #2c3a39; }
        th { background: #2d5551; }
        td { color: #f0925a; }
      }
    </style>
</head>
<body>
  <main>
    <h1>Fraude à Denden</h1>
    <p>Voici les fraudes à Denden</p>
    <table>
      <thead>
        <tr><th>Fraude à Denden</th></tr>
      </thead>
      <tbody>
        <tr><td id="fraude"></td></tr>
      </tbody>
    </table>
  </main>

  <script>
    // Données issues de Consommation-STEG-DenDen_1.xlsx
    var compteurDenden = 2000;  // C16
    var totalAout = 1900;       // C13
    // Même calcul que dans Excel : =C16-C13
    var fraude = compteurDenden - totalAout;
    document.getElementById("fraude").textContent = fraude.toLocaleString("fr-FR");
  </script>
</body>
</html>
